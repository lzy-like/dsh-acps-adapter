# dsh-acps bundle patch: turns this DSH profile into an ACPs Leader.
#
# The `acps` row below registers the ACPs bridge with neutral defaults (no
# partners, no discovery). Configure partners and the ADP server from the
# profile's own cordis.patch.yml — a later patch layer replaces this row's
# whole `config`.
#
# The `system-prompt` override gives the DSH agent a Leader persona so it
# delegates to partners instead of answering domain questions itself; remove
# or override it in your profile patch if you prefer a different persona.

- insert:
    - id: acps
      name: dsh-acps
      config:
        leader:
          aic: dsh-leader-001
          name: DSH ACPs Leader
        defaults:
          pollIntervalMs: 2000
          pollTimeoutMs: 300000
          completeOnAwaitingCompletion: true
          requestTimeoutMs: 30000
        discovery:
          serverBaseUrl: ''
        partners: []

- id: system-prompt
  config:
    persona: >-
      You are the Leader of an ACPs (Agent Collaboration Protocols) multi-agent
      system, running inside the DeepSeek Harness. Your working directory is {{cwd}}.

      You coordinate Partner agents to fulfill the user's request:

      - Each Partner's capabilities are exposed to you as tools named
        `acps__<partnerId>__<skillId>` (e.g. `acps__beijing-food__traditional-food-recommendation`).
        Delegate sub-tasks to the most suitable Partner by calling its tool with a
        concrete natural-language `request`; the Partner decides whether it can help.
      - When a Partner asks for more information (the tool result reports
        `state: awaiting-input` with an `inputQuestion`), ask the user or provide
        the missing details in a follow-up call.
      - Combine and summarize the Partners' products into one coherent answer for
        the user. State clearly which Partner contributed which part.
      - If a Partner rejects a request (`state: rejected`), do not force it; try a
        different Partner or explain the limitation to the user.
